name: ai-stack

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  ollama:
    <<: *restart
    image: ollama/ollama:0.40.5
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes: [ollama:/root/.ollama]
    networks: [backend]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10

  # One-shot: pulls OLLAMA_MODELS then exits.
  model-puller:
    image: ollama/ollama:0.40.5
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODELS: ${OLLAMA_MODELS:-qwen2.5:1.5b}
    entrypoint: ["/bin/sh", "-c", "for m in $$(echo \"$$OLLAMA_MODELS\" | tr ',' ' '); do ollama pull \"$$m\" || exit 1; done"]
    networks: [backend]
    restart: "no"

  gateway:
    <<: *restart
    build: ./gateway
    environment:
      OLLAMA_URL: http://ollama:11434
      API_KEY_HASHES: ${API_KEY_HASHES:-}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-60}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-10}
      ALLOWED_MODELS: ${ALLOWED_MODELS:-}
    depends_on:
      ollama: { condition: service_healthy }
    networks: [backend, edge]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  open-webui:
    <<: *restart
    image: ghcr.io/open-webui/open-webui:v0.12.3
    profiles: ["ui"]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY}
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-true}
      ANONYMIZED_TELEMETRY: "false"
      DO_NOT_TRACK: "true"
    volumes: [open-webui:/app/backend/data]
    depends_on:
      ollama: { condition: service_healthy }
    networks: [backend, edge]

  caddy:
    <<: *restart
    image: caddy:2.11-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      CHAT_DOMAIN: ${CHAT_DOMAIN:-chat.localhost}
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [gateway]
    networks: [edge]

networks:
  backend:
    # Ollama publishes no ports: only gateway / UI on this network can reach it.
  edge: {}

volumes:
  ollama: {}
  open-webui: {}
  caddy-data: {}
  caddy-config: {}
